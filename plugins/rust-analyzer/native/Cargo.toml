[package]
name         = "rust-analyzer-guard"
version      = "0.3.0"
edition      = { workspace = true }
rust-version = { workspace = true }
readme       = "../README.md"
license      = { workspace = true }
publish      = { workspace = true }

[target."cfg(unix)".dependencies]
libc = "0.2"

[target."cfg(windows)".dependencies."windows-sys"]
version  = "0.61"
features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"]
